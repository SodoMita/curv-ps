name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/index.html to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HEAD_REF="$(git rev-parse --short HEAD)"
          git checkout --orphan gh-pages-tmp
          git rm -q -rf .
          cp dist/index.html index.html
          git add index.html
          git commit -q -m "Pages: ${HEAD_REF}"
          git push -q -f origin gh-pages-tmp:gh-pages
